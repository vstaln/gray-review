[package]
name = "gray-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Review or simplify changed code via /review and /simplify prompts (pi-simplify + mitsupi review port)"

[[bin]]
name = "gray-review"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
